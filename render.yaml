services:
  - type: web
    name: pipflowtrade-main
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        value: https://pipflowtrade.site
      - key: FRONTEND_URL
        value: https://pipflowtrade.site
      - key: BOT_APP_URL
        value: https://bot.pipflowtrade.site
      - key: TRADER_APP_URL
        value: https://trader.pipflowtrade.site
      - key: CHARTS_APP_URL
        value: https://charts.pipflowtrade.site
      - key: OPTIONS_APP_URL
        value: https://options.pipflowtrade.site
      - key: DATABASE_URL
        fromDatabase:
          name: pipflowtrade-postgres
          property: connectionString
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_API_KEY
        sync: false
      - key: DERIV_OAUTH_URL
        value: https://oauth.deriv.com/oauth2/authorize
      - key: DERIV_OAUTH_REDIRECT_URI
        value: https://pipflowtrade.site/api/deriv/callback
      - key: DERIV_WS_URL
        value: wss://api.derivws.com/trading/v1/options/ws/public
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: SSO_SIGNING_SECRET
        generateValue: true
      - key: BOT_GATE_JWT_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MFA_SECRET
        sync: false

databases:
  - name: pipflowtrade-postgres
    plan: starter
    databaseName: pipflowtrade
    user: pipflowtrade_app
